<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Comment | Task Tracker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#2563eb;
            color:white;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
        }

        .logo{
            font-size:32px;
            font-weight:bold;
        }

        .btn{
            text-decoration:none;
            background:white;
            color:#2563eb;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            transition:.25s;
        }

        .btn:hover{
            background:#e5e7eb;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:40px auto;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        h1{
            color:#2563eb;
            margin-bottom:20px;
        }

        textarea, input{
            width:100%;
            padding:10px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
        }

        .save{
            background:#22c55e;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .save:hover{
            background:#16a34a;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        💬 Edit Comment
    </div>

    <a class="btn" href="{% url 'tasks:comment_list' task.pk %}">
        ← Back to Comments
    </a>

</header>

<div class="container">

    <div class="card">

        <h1>✏ Edit Comment</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="save" type="submit">Save</button>
        </form>

    </div>

</div>

</body>
</html>
