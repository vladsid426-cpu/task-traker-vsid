
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task | Task Tracker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#2563eb;
            color:white;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
        }

        .logo{
            font-size:32px;
            font-weight:bold;
        }

        .btn{
            text-decoration:none;
            background:white;
            color:#2563eb;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            transition:.25s;
        }

        .btn:hover{
            background:#e5e7eb;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:40px auto;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
        }

        form p{
            margin-bottom:18px;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            margin-top:6px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:16px;
        }

        textarea{
            min-height:120px;
            resize:vertical;
        }

        input:focus,
        textarea:focus,
        select:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#22c55e;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.25s;
        }

        button:hover{
            background:#16a34a;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        📋 Task Tracker
    </div>

    <a class="btn" href="{% url 'tasks:task_list' %}">
        ← Back
    </a>

</header>

<div class="container">

    <div class="card">

        <h1>➕ Create Task</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Task
            </button>

        </form>

    </div>

</div>

</body>
</html>
```
